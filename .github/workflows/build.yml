name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: The Nuclear Option (Build from Scratch)
        run: |
          # 1. Unzip your files to a quarantine folder
          mkdir temp_zip
          unzip FormatConverter.zip -d temp_zip
          
          # 2. Create a brand new, perfectly clean App on the server
          cordova create CloudApp com.format.converterstudio "Format Converter"
          
          # 3. Find ONLY your raw code and icon, leave all Termux junk behind
          USER_WWW=$(find temp_zip -type d -name "www" | head -n 1)
          USER_ICON=$(find temp_zip -type f -name "icon.png" | head -n 1)
          
          # 4. Swap the default code with your code
          rm -rf CloudApp/www
          cp -r "$USER_WWW" CloudApp/www
          
          if [ ! -z "$USER_ICON" ]; then
            cp "$USER_ICON" CloudApp/icon.png
          fi
          
          # 5. Safely inject the icon setting into the new config
          cd CloudApp
          sed -i 's|</widget>|    <icon src="icon.png" />\n</widget>|g' config.xml
          
          # 6. Install the plugin and Build!
          cordova plugin add cordova-plugin-file
          cordova platform add android
          cordova build android
          
          # 7. Move the APK to the finish line
          mkdir -p ../output-apk
          cp platforms/android/app/build/outputs/apk/debug/*.apk ../output-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: output-apk/*.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: output-apk/*.apk
          
          
