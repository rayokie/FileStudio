name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Extract Project
        run: |
          mkdir my_app_extract
          unzip FormatConverter.zip -d my_app_extract

      - name: Build APK
        run: |
          # Find the folder
          APP_DIR=$(dirname $(find my_app_extract -name "config.xml" | head -n 1))
          cd "$APP_DIR"
          
          # Force a perfectly clean config.xml to bypass the parsing error
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.format.converterstudio" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Format Converter Studio</name>
              <description>Direct File Conversion</description>
              <author email="dev@null.com" href="https://example.com">Studio</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <icon src="icon.png" />
          </widget>
          EOF
          
          # Clean up old Termux files
          rm -rf platforms node_modules plugins package-lock.json
          npm install
          
          # Build the App
          cordova platform add android
          cordova plugin add cordova-plugin-file
          cordova build android
          
          # Move the finished APK to the upload zone
          mkdir -p $GITHUB_WORKSPACE/output-apk
          cp platforms/android/app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/output-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: output-apk/*.apk
          
