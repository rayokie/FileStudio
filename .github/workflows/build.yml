name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: The Nuclear Option (Build from Scratch)
        run: |
          mkdir temp_zip
          unzip FormatConverter.zip -d temp_zip
          
          cordova create CloudApp com.format.converterstudio "Format Converter"
          cd CloudApp
          
          # Wipe the default files
          rm -rf www/*
          
          # Force copy the CONTENTS of your www folder, not the folder itself
          USER_WWW=$(find ../temp_zip -type d -name "www" | head -n 1)
          cp -a "$USER_WWW"/. www/
          
          USER_ICON=$(find ../temp_zip -type f -name "icon.png" | head -n 1)
          if [ ! -z "$USER_ICON" ]; then
            cp "$USER_ICON" icon.png
          fi
          
          # The ultimate Config file with Android HTTP bypass rules
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.format.converterstudio" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Format Converter Studio</name>
              <description>Direct File Conversion</description>
              <author email="dev@null.com" href="https://example.com">Studio</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="scheme" value="http" />
              <preference name="hostname" value="localhost" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <icon src="icon.png" />
          </widget>
          EOF
          
          cordova plugin add cordova-plugin-file
          cordova platform add android
          cordova build android
          
          mkdir -p ../output-apk
          cp platforms/android/app/build/outputs/apk/debug/*.apk ../output-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: output-apk/*.apk
          
