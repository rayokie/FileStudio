name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build from Scratch
        run: |
          unzip FormatConverter.zip -d temp_zip
          cordova create CloudApp com.format.converterstudio "Format Converter"
          cd CloudApp
          
          # Delete the dummy Cordova robot code
          rm -rf www/*
          
          # Copy your actual HTML/CSS/JS files
          cp -r ../temp_zip/www/* www/
          
          if [ -f "../temp_zip/icon.png" ]; then
            cp ../temp_zip/icon.png icon.png
          fi
          
          # Create perfect config file (Safe generation)
          echo "<?xml version='1.0' encoding='utf-8'?>" > config.xml
          echo "<widget id='com.format.converterstudio' version='1.0.0' xmlns='http://www.w3.org/ns/widgets'>" >> config.xml
          echo "  <name>Format Converter Studio</name>" >> config.xml
          echo "  <description>Direct File Conversion</description>" >> config.xml
          echo "  <author>Studio</author>" >> config.xml
          echo "  <content src='index.html' />" >> config.xml
          echo "  <access origin='*' />" >> config.xml
          echo "  <allow-intent href='http://*/*' />" >> config.xml
          echo "  <allow-intent href='https://*/*' />" >> config.xml
          echo "  <allow-navigation href='*' />" >> config.xml
          echo "  <preference name='scheme' value='https' />" >> config.xml
          echo "  <preference name='hostname' value='localhost' />" >> config.xml
          echo "  <icon src='icon.png' />" >> config.xml
          echo "</widget>" >> config.xml
          
          # Build App
          cordova plugin add cordova-plugin-file
          cordova platform add android
          cordova build android
          
          # Prepare APK
          mkdir -p ../output-apk
          cp platforms/android/app/build/outputs/apk/debug/*.apk ../output-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: output-apk/*.apk
          
